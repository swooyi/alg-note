<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>swooyi's ALG note</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="is-home-view sidebar-closed">
  <header class="app-header">
    <div class="header-main">
      <div class="header-title-row">
        <button id="sidebarOpenButton" class="sidebar-icon-button" type="button" aria-controls="appSidebar" aria-expanded="true" aria-label="패널 닫기" title="패널">
          <span class="panel-icon" aria-hidden="true"></span>
        </button>
        <div>
          <h1>swooyi's ALG note</h1>
          <p id="datasetLabel"></p>
        </div>
      </div>
      <div class="header-actions">
        <button id="homeButton" class="home-button home-icon-button" type="button" aria-label="홈" title="홈">⌂</button>
        <div class="home-settings-wrapper">
          <button id="homeSettingsButton" class="home-settings-button home-icon-button" type="button" aria-label="설정" title="설정" aria-expanded="false">⚙</button>
          <div id="homeSettingsPopover" class="home-settings-popover" hidden>
            <h2>설정</h2>
            <div class="theme-setting-group" aria-label="색상 테마">
              <span>색상</span>
              <div class="accent-theme-buttons">
                <button class="accent-theme-button" type="button" data-accent-theme="red" aria-label="빨강" title="빨강"><span class="accent-theme-swatch red"></span></button>
                <button class="accent-theme-button" type="button" data-accent-theme="yellow" aria-label="노랑" title="노랑"><span class="accent-theme-swatch yellow"></span></button>
                <button class="accent-theme-button" type="button" data-accent-theme="green" aria-label="초록" title="초록"><span class="accent-theme-swatch green"></span></button>
                <button class="accent-theme-button" type="button" data-accent-theme="blue" aria-label="파랑" title="파랑"><span class="accent-theme-swatch blue"></span></button>
                <button class="accent-theme-button" type="button" data-accent-theme="purple" aria-label="보라" title="보라"><span class="accent-theme-swatch purple"></span></button>
                <button class="accent-theme-button" type="button" data-accent-theme="mono" aria-label="흑백" title="흑백"><span class="accent-theme-swatch mono"></span></button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <select id="datasetSelect" class="dataset-select" aria-label="공식 폴더" hidden></select>
    </div>
  </header>

  <section id="homeView" class="home-view">
    <div class="home-inner">
      <div class="home-title">
        <span></span>
        <button id="exportJsonButton" class="primary-export-button" type="button">수정 JSON</button>
      </div>
      <section id="presetShortcutSection" class="home-section preset-shortcut-section">
        <h2>프리셋 바로가기</h2>
        <div id="presetShortcutGrid" class="preset-shortcut-grid"></div>
        <p id="presetShortcutEmpty" class="preset-shortcut-empty">등록된 바로가기가 없습니다.</p>
      </section>
      <section class="home-section dataset-home-section">
        <h2>해법 선택</h2>
        <div id="datasetHomeGrid" class="dataset-home-grid"></div>
      </section>
    </div>
  </section>

  <section id="exportPanel" class="export-panel" hidden>
    <div class="export-panel-top">
      <div>
        <h2 id="exportPanelTitle">수정 json</h2>
        <p id="exportPanelDescription">브라우저에 저장된 수정 내용을 모은 결과입니다.</p>
      </div>
      <div class="export-actions">
        <div class="export-mode-buttons" aria-label="출력 방식">
          <button id="exportFullButton" class="is-active" type="button">전체 JSON</button>
          <button id="exportEditsButton" type="button">편집분만</button>
        </div>
        <button id="copyJsonButton" type="button">복사</button>
        <button id="downloadJsonButton" type="button">다운로드</button>
        <button id="resetJsonButton" class="reset-json-button" type="button">JSON 초기화</button>
        <button id="closeExportButton" type="button" aria-label="출력 닫기">닫기</button>
      </div>
    </div>
    <textarea id="exportJsonText" spellcheck="false"></textarea>
  </section>

  <div class="app-shell">
    <aside id="appSidebar" class="app-sidebar">
      <div class="sidebar-inner">
        <section class="sidebar-section">
          <h2>검색</h2>
          <input id="searchInput" type="search" placeholder="이름, 공식, 스크램블 검색">
        </section>

        <section class="sidebar-section favorite-preset-group">
          <h2>프리셋</h2>
          <input id="favoritePresetNameInput" type="text" placeholder="선택 프리셋 이름" aria-label="새 선택 프리셋 이름">
          <button id="saveFavoritePresetButton" type="button">저장</button>
          <div id="favoritePresetList" class="preset-list" role="list" aria-label="저장한 프리셋"></div>
        </section>

      </div>
      <div id="sidebarResizeHandle" class="sidebar-resize-handle" role="separator" aria-orientation="vertical" aria-label="패널 폭 조절"></div>
    </aside>

    <main>
      <div id="appToolbar" class="toolbar">
        <div class="control-row">
          <div class="control-group filter-group">
            <span class="control-label">필터</span>
            <div class="filter-menu">
              <button id="groupFilterButton" class="filter-menu-button" type="button" data-filter-menu="group" aria-expanded="false">group</button>
              <div id="groupFilterOptions" class="filter-option-panel" hidden></div>
            </div>
            <div class="filter-menu">
              <button id="recognitionFilterButton" class="filter-menu-button" type="button" data-filter-menu="recognition" aria-expanded="false">recog</button>
              <div id="recognitionFilterOptions" class="filter-option-panel" hidden></div>
            </div>
            <div class="filter-menu">
              <button id="bookmarkFilterButton" class="filter-menu-button" type="button" data-filter-menu="bookmark" aria-expanded="false">bookmark</button>
              <div id="bookmarkFilterOptions" class="filter-option-panel" hidden></div>
            </div>
            <button id="clearFiltersButton" type="button">필터 초기화</button>
          </div>
          <div class="control-group view-group">
            <span class="control-label">보기</span>
            <button id="selectedOnlyButton" class="selected-only-toggle" type="button">선택만</button>
            <div class="view-mode-switcher" aria-label="보기 모드">
              <button class="view-mode-button" type="button" data-view-mode="compact">간단히</button>
              <button class="view-mode-button" type="button" data-view-mode="list">목록</button>
              <button class="view-mode-button" type="button" data-view-mode="full">세부</button>
            </div>
          </div>
          <div class="control-group selection-action-group">
            <span class="control-label">선택</span>
            <div class="selection-action-buttons">
              <button id="selectAllCardsButton" type="button">전체</button>
              <button id="clearSelectedCardsButton" type="button">해제</button>
            </div>
          </div>
        </div>
      </div>

      <section id="emptyState" class="empty-state" hidden></section>

      <section id="summary" class="summary" hidden></section>
      <section id="caseGrid" class="case-grid" hidden></section>
    </main>
  </div>

  <section id="caseDetail" class="case-detail" hidden></section>
  <button id="drillStartButton" class="drill-fab" type="button" aria-label="드릴 시작" title="드릴 시작">▶</button>

  <section id="drillOverlay" class="drill-overlay" hidden>
    <div class="drill-panel">
      <div class="drill-top">
        <button id="drillCloseButton" class="drill-icon-button" type="button" aria-label="드릴 닫기" title="드릴 닫기">←</button>
        <div class="drill-mode-tabs" aria-label="드릴 모드">
          <button id="drillRecapModeButton" type="button" data-drill-mode="recap">Recap</button>
          <button id="drillTrainModeButton" type="button" data-drill-mode="train">Train</button>
        </div>
        <button id="drillRandomAufButton" class="drill-random-auf-button" type="button" aria-pressed="false">랜덤 AUF</button>
      </div>
      <div id="drillProgress" class="drill-progress">Recap 0 / 0</div>
      <div class="drill-scramble-row">
        <p id="drillSetupText"></p>
        <button id="drillShowAnswerButton" class="drill-help-button" type="button" aria-label="정답 패널" title="정답 패널">?</button>
      </div>
      <div class="drill-body">
        <div id="drillMain" class="drill-main">
          <div id="drillTimerText" class="drill-timer">0.00</div>
          <div id="drillHintText" class="drill-hint">Space로 시작</div>
        </div>
        <aside class="drill-history-panel">
          <div class="drill-history-summary">
            <span id="drillTimesText">Times 0</span>
            <span id="drillAverageText">Avg -</span>
          </div>
          <div id="drillResultList" class="drill-result-list"></div>
        </aside>
      </div>
      <div class="drill-actions">
        <button id="drillUndoButton" type="button">직전 취소</button>
        <button id="drillNextButton" type="button">스킵</button>
      </div>
    </div>
  </section>

  <template id="caseCardTemplate">
    <article class="case-card">
      <div class="card-top">
        <div>
          <h2 class="case-name"></h2>
          <p class="case-meta"></p>
        </div>
        <div class="quick-actions">
          <button class="bookmark-button bookmark-red-sun icon-button" type="button" data-bookmark="red-sun" aria-label="빨간 해 북마크" title="빨간 해 북마크">☀</button>
          <button class="bookmark-button bookmark-green-moon icon-button" type="button" data-bookmark="green-moon" aria-label="초록 달 북마크" title="초록 달 북마크">☾</button>
          <button class="bookmark-button bookmark-yellow-star icon-button" type="button" data-bookmark="yellow-star" aria-label="노란 별 북마크" title="노란 별 북마크">★</button>
          <button class="bookmark-button bookmark-blue-cloud icon-button" type="button" data-bookmark="blue-cloud" aria-label="파란 구름 북마크" title="파란 구름 북마크">☁</button>
          <button class="edit-button icon-button" type="button" aria-label="편집" title="편집">✎</button>
        </div>
      </div>
      <div class="svg-box"></div>
      <div class="case-section setup-section">
        <h3>setup</h3>
        <p class="scramble"></p>
      </div>
      <div class="case-section alg-section">
        <h3>alg</h3>
        <ul class="algorithm-list"></ul>
      </div>
    </article>
  </template>

  <script src="./js/storage.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/normalize.js"></script>
  <script src="./js/render.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
